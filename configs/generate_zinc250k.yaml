# Generate from a ZINC-250k checkpoint and report quality metrics.
#
#   python scripts/generate.py configs/generate_chebi.yaml generate.checkpoint=checkpoints/v12/ep499-ba9500

run_name: generate
task: diffusion

variables:
  seq_len: 64
  tokenizer_path: data/zinc250k/tokenizers/bpe_384_alpha.json

tokenizer:
  path: ${variables.tokenizer_path}

# alpha/beta must match the training run
diffusion:
  regime: epsilon
  alpha: {name: cosine}
  beta: {name: cosine}
  p_simple_std: 1.0

generate:
  checkpoint: checkpoints/zinc_baseline/ep22-ba10000
  seq_len: ${variables.seq_len}
  num_samples: 2000              # >= 2000 for a stable estimate of low validity
  batch_size: 500
  num_timesteps: 300             # solver steps. 100 measured equal to 1000, so 100 is
                                 # the cheap default for screening
  variance: 1.0                  # noise in the reverse SDE. 1.0 is best measured; 0.0 is
                                 # the deterministic probability flow and 1.4 points worse
  strict_decode: false           # true replaces the bracket and ring-digit counting with
                                 # the full connectivity check: no ring closed onto its
                                 # own atom, no closure duplicating an existing bond, no
                                 # empty branch. Counting alone lets through about half
                                 # of all attempts as unparseable
  restrict_atoms: false          # true forbids bracket atoms the training corpus never
                                 # uses ([CH], [P], [SH] and friends, 14-16% of accepted
                                 # molecules carry one); needs train_smiles_path
  on_disallowed: next_best       # for a forbidden atom: next_best lets the model choose
                                 # again inside the allowed vocabulary, skip drops it
  time_grid: uniform             # where the solver puts its steps: uniform (original),
                                 # data_dense, noise_dense, mid_dense, ends_dense. The
                                 # endpoints and the step count are the same either way
  time_grid_power: 2.0           # how hard the non-uniform grids are skewed
  t_start: 1.0e-3
  t_end: 0.999
  seed: 42                       # fixed, so runs are comparable
  regime: null                   # null -> taken from diffusion.regime
  train_smiles_path: data/zinc250k/corpus/train   # shards; used for novelty
  output_dir: null               # null -> next to the checkpoint
  progress: true

tf32: false
